events {}

http {
    upstream web        { server web:80; }
    upstream core_api   { server core-api:8080; }
    upstream ai_service { server ai-service:8000; }

    server {
        listen 80;

        # Java: авторизация и бизнес-эндпоинты
        location /api/ {
            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Python: LLM. Буферизация отключена, чтобы SSE шёл без задержек
        location /ai/ {
            proxy_pass http://ai_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # /internal/* наружу не отдаём
        location /internal/ {
            return 404;
        }

        # SPA
        location / {
            proxy_pass http://web;
        }
    }
}
