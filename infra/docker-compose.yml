# Поднимает весь проект: make up
# Dockerfile'ы появятся в сервисах при их инициализации.

name: ai-interviews

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - core-api
      - ai-service

  web:
    build: ../services/web

  core-api:
    build: ../services/core-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=core
      DB_USER: ${CORE_DB_USER}
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    secrets:
      - jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ../services/ai-service
    environment:
      DB_URL: postgresql+asyncpg://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY}
      ROUTERAI_MODEL: ${ROUTERAI_MODEL}
      CORE_API_URL: http://core-api:8080
      JWKS_URL: http://core-api:8080/api/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # для локальной отладки
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem

volumes:
  pgdata:
