spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  access-ttl: ${JWT_ACCESS_TTL:15m}