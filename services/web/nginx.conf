server {
    listen 80;
    root /usr/share/nginx/html;

    # Файлы с хешем в имени можно кешировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: любой путь (/interviews/123) отдаём index.html, дальше разбирается роутер
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
