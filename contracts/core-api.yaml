openapi: 3.1.0
info:
  title: core-api
  version: 0.1.0
  description: Авторизация, пользователи, собеседования.
servers:
  - url: /api

paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Логин
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK. Refresh-токен ставится в httpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Обновить access-токен по refresh cookie
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Выход (инвалидирует refresh-токен)
      responses:
        '204': { description: OK }

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [auth]
      summary: Публичные ключи для проверки JWT (используется ai-service)
      security: []
      responses:
        '200': { description: JWKS }

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Текущий пользователь
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: История собеседований пользователя
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Interview' }
    post:
      operationId: createInterview
      tags: [interviews]
      summary: Создать собеседование
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInterviewRequest' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }

  /interviews/{id}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Собеседование с результатом
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interview' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: секунды }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }

    InterviewLevel:
      type: string
      enum: [intern, junior, middle, senior]

    InterviewStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, FINISHED]

    CreateInterviewRequest:
      type: object
      required: [position, level]
      properties:
        position: { type: string, example: Java Backend Developer }
        level: { $ref: '#/components/schemas/InterviewLevel' }
        topics:
          type: array
          items: { type: string }

    Interview:
      type: object
      required: [id, position, level, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        position: { type: string }
        level: { $ref: '#/components/schemas/InterviewLevel' }
        status: { $ref: '#/components/schemas/InterviewStatus' }
        createdAt: { type: string, format: date-time }
        topics:
          type: array
          items: { type: string }
        result:
          description: Заполняется после завершения собеседования
          oneOf:
            - { $ref: '#/components/schemas/InterviewResult' }
            - { type: 'null' }

    InterviewResult:
      type: object
      required: [score, summary, strengths, weaknesses]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        summary: { type: string }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
