openapi: 3.1.0
info:
  title: ai-service
  version: 0.1.0
  description: Диалог с LLM в рамках собеседования. JWT выдаёт core-api.
servers:
  - url: /ai

security:
  - bearer: []

paths:
  /interviews/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      summary: История сообщений собеседования
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Отправить ответ кандидата, получить реплику интервьюера стримом
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: |
            Server-Sent Events. События:
            - `delta`  — {"text": "..."} кусок ответа
            - `done`   — {"messageId": "..."} ответ завершён
            - `error`  — {"detail": "..."}
            Если стрим оборвался или пришло `error`, ответ кандидата не сохраняется — его можно отправить снова.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Собеседование завершено, вопросы закончились или ещё выполняется предыдущее действие
            (ответ интервьюера или подведение итогов). Причина — в `detail`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
        '422': { description: Пустой или слишком длинный ответ }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /interviews/{id}/finish:
    post:
      operationId: finishInterview
      tags: [chat]
      summary: Завершить собеседование и получить оценку
      description: Результат также сохраняется в core-api через /internal.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: OK. Для уже завершённого собеседования — сохранённый результат.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Нет ни одного ответа на вопросы или ещё идёт ответ интервьюера. Причина — в `detail`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /health:
    get:
      operationId: health
      tags: [system]
      summary: Healthcheck
      security: []
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InterviewId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Нет или неверный токен
    NotFound:
      description: Собеседование не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
    BadGateway:
      description: Сбой модели или связанного сервиса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
    Unavailable:
      description: Модель или связанный сервис временно недоступны
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }

  schemas:
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }

    Message:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [interviewer, candidate] }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    Evaluation:
      type: object
      required: [score, summary, strengths, weaknesses, criteria, recommendations]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Округлённое (half-up) среднее оценок по критериям
        summary: { type: string, minLength: 1, maxLength: 4000 }
        strengths: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 500 } }
        weaknesses: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 500 } }
        criteria:
          type: array
          description: Ровно 4 критерия, каждый ключ по одному разу
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/EvaluationCriterion' }
        recommendations: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 500 } }

    EvaluationCriterion:
      type: object
      required: [key, score, comment]
      properties:
        key:
          type: string
          enum: [technical_knowledge, practical_depth, communication, problem_solving]
        score: { type: integer, minimum: 0, maximum: 100 }
        comment: { type: string, minLength: 1, maxLength: 1000 }
